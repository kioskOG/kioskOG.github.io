---
# Error layout — Clean chrome for 404/500 pages
---
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% seo %}

  <!-- Theme Blocker Script -->
  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme-preset') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" />
  <!-- Shared Portfolio CSS -->
  <link rel="stylesheet" href="{{ '/assets/portfolio.css' | relative_url }}" />
  {% include head-theme.html %}
</head>

<body>

  <div class="bg-blobs" aria-hidden="true"></div>

  <div class="page-wrap">

    {% include site-nav.html %}

    <!-- MAIN CONTENT -->
    <main id="main-content">
      {{ content }}
    </main>

    {% include site-footer.html %}

  </div>

  <!-- Back to Top Button -->
  <button id="back-to-top" class="back-to-top-btn" aria-label="Back to top" type="button">
    <i class="fas fa-arrow-up" aria-hidden="true"></i>
  </button>

  <script>
    (function () {
      'use strict';
      var y = document.getElementById('year');
      if (y) y.textContent = new Date().getFullYear();
      // Mobile nav toggling is handled once in assets/effects.js


      // 1. Scroll Progress Bar
      var progressBar = document.getElementById('scroll-progress');
      if (progressBar) {
        window.addEventListener('scroll', function () {
          var totalScroll = document.documentElement.scrollHeight - window.innerHeight;
          var scrollPercent = totalScroll > 0 ? (window.scrollY / totalScroll) * 100 : 0;
          progressBar.style.width = scrollPercent + '%';
        });
      }

      // 2. Back to Top Button Logic
      var bttBtn = document.getElementById('back-to-top');
      if (bttBtn) {
        window.addEventListener('scroll', function () {
          var scrollPos = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
          if (scrollPos > 400) {
            bttBtn.classList.add('show');
          } else {
            bttBtn.classList.remove('show');
          }
        });
        bttBtn.addEventListener('click', function () {
          try {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } catch (err) {
            window.scrollTo(0, 0);
          }
          try {
            document.documentElement.scrollTo({ top: 0, behavior: 'smooth' });
          } catch (err) {
            document.documentElement.scrollTop = 0;
          }
          try {
            document.body.scrollTo({ top: 0, behavior: 'smooth' });
          } catch (err) {
            document.body.scrollTop = 0;
          }
        });
      }
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js" crossorigin="anonymous"></script>
  <script src="{{ '/assets/search.js' | relative_url }}"></script>
  <script src="{{ '/assets/effects.js' | relative_url }}"></script>

</body>
</html>
