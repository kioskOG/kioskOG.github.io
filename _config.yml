# title: Home
title: Jatin Sharma | DevOps & MLOps Blog
logo: "./site-icon.png"
# favicon_ico: "./favicon.ico"
description: "Expert insights on DevOps, Platform Engineering, MLOps, and Kubernetes. Scaling infrastructure with automation and observability."
author: Jatin Sharma
github_username: kioskOG
twitter_username: kioskOG
theme: just-the-docs
color_scheme: dark
lang: en

url: https://blog.jatinog.com
baseurl: ""

# SEO Configuration
social:
  name: Jatin Sharma
  links:
    - https://github.com/kioskOG
    - https://www.linkedin.com/in/jatin-devops/

sass:
  quiet_deps: true
  silence_deprecations: ["import"]

aux_links:
  Repository: https://github.com/kioskOG/kioskOG.github.io

aux_links_new_tab: true
search_enabled: true

search:
  focus_shortcut_key: 'k'

nav_enabled: true
heading_anchors: true

callouts_level: quiet # or loud # https://just-the-docs.com/docs/ui-components/callouts/
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

mermaid:
  version: "9.4.3"



# exclude:
#   - README.md
